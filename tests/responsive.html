<!doctype html><meta charset="utf-8"><title>Family hub responsive QA</title><style>body{margin:0;background:#d9ded7;font:12px system-ui}header{min-height:72px;display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:4px 12px;background:white}button{padding:7px;font:inherit}#holder{margin:10px auto;position:relative}iframe{border:0;transform-origin:top left;box-shadow:0 3px 18px #0002}#report{white-space:pre-wrap;max-width:1050px;margin:4px auto;color:#274b34;background:#fff;padding:6px;max-height:95px;overflow:auto}</style><header><button onclick="go('index.html')">Home</button><button onclick="go('shapes.html')">Shapes</button><button onclick="go('garden.html')">Garden</button><button onclick="go('peekaboo.html')">Peek</button><button onclick="go('wash.html')">Wash</button><button onclick="go('safety.html')">Safety</button><button onclick="show(768,1024,.49)">Tablet portrait 768×1024</button><button onclick="show(1024,768,.64)">Tablet landscape 1024×768</button><button onclick="show(390,844,.59)">Phone portrait 390×844</button><button onclick="show(844,390,.8)">Phone landscape 844×390</button><button onclick="report()">Inspect layout</button><span id="size"></span></header><pre id="report"></pre><div id="holder"><iframe title="Game test viewport" id="game" src="index.html"></iframe></div><script>function go(path){document.querySelector('iframe').src=path;}function show(w,h,s){const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+s+')';document.querySelector('#holder').style.width=w*s+'px';document.querySelector('#holder').style.height=h*s+'px';document.querySelector('#size').textContent=w+' × '+h;}function report(){const f=document.querySelector('iframe'),d=f.contentDocument,w=f.contentWindow;document.querySelector('#report').textContent=JSON.stringify({url:d.location.pathname,viewport:[w.innerWidth,w.innerHeight],scroll:[d.documentElement.scrollWidth,d.documentElement.scrollHeight],horizontalOverflow:d.documentElement.scrollWidth>w.innerWidth,controls:[...d.querySelectorAll('button,a.home,a.home-link')].filter(b=>b.getBoundingClientRect().height&&w.getComputedStyle(b).visibility!=='hidden').map(b=>{let r=b.getBoundingClientRect();return {text:b.getAttribute('aria-label')||b.textContent.trim(),w:Math.round(r.width),h:Math.round(r.height),withinX:r.left>=0&&r.right<=w.innerWidth,withinY:r.top>=0&&r.bottom<=w.innerHeight}}),newGame:w.littleGameState,car:w.carBathState,safety:w.safetyGameState,voices:w.speechSynthesis?.getVoices().length},null,1);}show(768,1024,.49);</script>
