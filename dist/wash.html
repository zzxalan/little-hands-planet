<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f5e9" />
<meta name="description" content="和小汽车、消防车、工程车一起洗个泡泡澡。轻轻摸，慢慢玩。" />
<title>车车洗澡 · 慢慢玩</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='25' width='56' height='25' rx='12' fill='%23ec967e'/%3E%3Cpath d='M17 27l7-15h19l9 15' fill='%23b2dadd'/%3E%3Ccircle cx='18' cy='49' r='9' fill='%23475e62'/%3E%3Ccircle cx='47' cy='49' r='9' fill='%23475e62'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand"><svg width="43" height="43" viewBox="0 0 50 50" aria-hidden="true"><circle cx="22" cy="30" r="15" fill="#a4d9d5"/><circle cx="36" cy="16" r="10" fill="#d5eaf0"/><circle cx="12" cy="8" r="5" fill="#f4c998"/><path d="M14 25q2-5 7-5M32 13q1-3 4-3" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/></svg><div><h1>车车洗澡</h1><p>小小车，大大泡泡</p></div></div>
  <div class="top-actions"><a class="home-link" href="./" aria-label="回到小手星球">⌂ <span>回星球</span></a><button id="sound" class="circle-btn" aria-label="关闭声音" aria-pressed="false" title="声音"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 12h5l7-6v20l-7-6H6z" fill="currentColor"/><path class="sound-waves" d="M22 10q6 6 0 12M25 6q10 10 0 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path class="sound-off" d="m23 12 6 8m0-8-6 8" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg></button></div>
</header>
<main id="play-area">
  <div class="scene-frame">
    <canvas id="scene" aria-label="洗车区，在小车身上轻点或滑动来洗澡" role="img"></canvas>
    <div class="scene-label"><span class="tiny-bubble"></span> 泡泡小车站 <span class="label-dot">✦</span></div>
    <div class="hint" aria-live="polite"><span id="hint-text">给车车搓泡泡</span><span id="hint-sub">摸一摸 · 搓一搓</span></div>
    <div id="step-pips" aria-label="洗澡的三个步骤"><span class="current"></span><span></span><span></span></div>
    <div id="done" class="done-panel" hidden><span class="done-heart">♥</span><strong>香香的，真舒服！</strong><button id="again" aria-label="再洗一次"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M7 10a10 10 0 1 1-1 10M7 3v8H0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>再洗一次</button></div>
  </div>
  <nav class="play-controls" aria-label="洗车工具和小车">
    <div class="tools" role="group" aria-label="洗车工具">
      <button class="tool selected" data-tool="soap" aria-pressed="true" aria-label="泡泡，给车车搓泡泡"><span class="tool-icon"><svg viewBox="0 0 80 70" aria-hidden="true"><path d="M15 35q0-9 11-10l33 2q10 0 10 10v16q0 10-11 10H25q-10 0-10-9z" fill="#e7ad54"/><path d="M15 32q0-10 11-10l33 2q10 0 10 10v15q0 10-11 10H25q-10 0-10-9z" fill="#ffd47d"/><path d="M23 37h3m10-6h3m14 8h3M30 49h3m17 2h3" stroke="#e8af54" stroke-width="4" stroke-linecap="round"/><circle cx="21" cy="18" r="10" fill="#d5f0ed" stroke="white" stroke-width="2"/><circle cx="43" cy="15" r="13" fill="#d5f0ed" stroke="white" stroke-width="2"/><circle cx="61" cy="21" r="8" fill="#d5f0ed" stroke="white" stroke-width="2"/><circle cx="58" cy="4" r="4" fill="#a9dcd8"/></svg></span><span>泡泡</span><i class="tool-tick" aria-hidden="true">✓</i></button>
      <button class="tool" data-tool="water" aria-pressed="false" aria-label="冲水，冲掉泡泡"><span class="tool-icon"><svg viewBox="0 0 80 70" aria-hidden="true"><path d="m21 55 17-23" stroke="#91babf" stroke-width="12" stroke-linecap="round"/><path d="m30 23 15-15q5-4 11 0l14 13q4 5 0 9L54 44z" fill="#86c9cd"/><path d="m27 25 26 22" stroke="#477b86" stroke-width="8" stroke-linecap="round"/><path d="m22 34-7 9m18-2-7 9m19-1-7 9" stroke="#78c6df" stroke-width="4" stroke-linecap="round"/><path d="m18 54-3 4m16 0-3 4M9 46l-3 4" stroke="#78c6df" stroke-width="4" stroke-linecap="round"/><path d="m46 15 9 8" stroke="#bce9e9" stroke-width="5" stroke-linecap="round"/></svg></span><span>冲水</span><i class="tool-tick" aria-hidden="true">✓</i></button>
      <button class="tool" data-tool="dry" aria-pressed="false" aria-label="擦干，用小毛巾擦一擦"><span class="tool-icon"><svg viewBox="0 0 80 70" aria-hidden="true"><path d="M15 12q16 4 28 0t23 2v44q-15-4-25 1t-26-1z" fill="#edafa5"/><path d="M15 12q16 4 28 0t23 2v36q-15-4-25 1t-26-1z" fill="#f8c6ba"/><path d="M21 18q12 2 22-1t17 1M21 43q12 3 23-1t16 1" stroke="#fff3dc" stroke-width="4" fill="none"/><path d="M20 58v6m9-5v6m9-4v5m9-6v5m9-7v5m9-5v5" stroke="#de9d97" stroke-width="2" stroke-linecap="round"/><path d="M36 23v10m-5-5h10" stroke="#fff4e1" stroke-width="3" stroke-linecap="round"/></svg></span><span>擦干</span><i class="tool-tick" aria-hidden="true">✓</i></button>
    </div>
    <div class="control-divider"></div>
    <div class="vehicles" role="group" aria-label="换一辆小车"><span class="choose-label">今天洗谁？</span><div class="vehicle-options"><button class="vehicle selected" data-car="car" aria-label="小汽车" aria-pressed="true"><canvas width="190" height="110" aria-hidden="true"></canvas></button><button class="vehicle" data-car="fire" aria-label="消防车" aria-pressed="false"><canvas width="190" height="110" aria-hidden="true"></canvas></button><button class="vehicle" data-car="digger" aria-label="工程车" aria-pressed="false"><canvas width="190" height="110" aria-hidden="true"></canvas></button></div></div>
  </nav>
</main>
<div id="welcome" class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcome-title"><div class="welcome-card"><div class="welcome-bubbles"><i></i><i></i><i></i></div><span class="welcome-eyebrow">欢迎来到泡泡小车站</span><h2 id="welcome-title">给车车<br>洗个泡泡澡</h2><p>用小手摸一摸，就会变干净。</p><button id="start" aria-label="开始洗车"><span>▶</span> 开始玩</button><span class="welcome-foot">没有倒计时，只有慢慢玩的快乐</span><a class="welcome-home" href="./">回到小手星球</a></div></div>
</div>
<script src="./game.js"></script>
</body>
</html>
